services:
  postgres:
    image: postgres:16-alpine
    container_name: empyr-postgres
    environment:
      POSTGRES_DB: empyr
      POSTGRES_USER: empyr
      POSTGRES_PASSWORD: empyr
    ports:
      - "5432:5432"
    volumes:
      - empyr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empyr -d empyr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  empyr-postgres-data:
